<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Model Expander – Prod Model CD 분리기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #f9fafb;
            --surface: #ffffff;
            --border: #e5e7eb;
            --border-focus: #6366f1;
            --text-primary: #111827;
            --text-muted: #6b7280;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --accent-fg: #ffffff;
            --destructive: #ef4444;
            --success: #10b981;
            --radius: 8px;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, .08), 0 1px 2px rgba(0, 0, 0, .05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, .08), 0 2px 4px -1px rgba(0, 0, 0, .04);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 32px 16px 64px;
        }

        /* ── Layout ── */
        .container {
            max-width: 960px;
            margin: 0 auto;
        }

        .page-header {
            margin-bottom: 28px;
        }

        .page-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -.3px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-header h1 .icon {
            width: 36px;
            height: 36px;
            background: var(--accent);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .page-header p {
            color: var(--text-muted);
            font-size: .875rem;
            margin-top: 6px;
        }

        /* ── Card ── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: calc(var(--radius) + 4px);
            box-shadow: var(--shadow-sm);
            padding: 24px;
            margin-bottom: 20px;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: .9375rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 9999px;
            font-size: .72rem;
            font-weight: 600;
            background: #ede9fe;
            color: #6d28d9;
        }

        .badge.success {
            background: #d1fae5;
            color: #065f46;
        }

        /* ── Paste area ── */
        .paste-area {
            width: 100%;
            min-height: 140px;
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            padding: 14px;
            font-family: 'Inter', monospace;
            font-size: .8125rem;
            color: var(--text-primary);
            resize: vertical;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
            background: var(--bg);
            line-height: 1.6;
        }

        .paste-area:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, .15);
            background: var(--surface);
        }

        .paste-area::placeholder {
            color: var(--text-muted);
        }

        /* ── Hint row ── */
        .col-hint {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .col-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px;
            border-radius: 9999px;
            font-size: .75rem;
            font-weight: 500;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-muted);
        }

        .col-chip .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
        }

        .dot-a {
            background: #818cf8;
        }

        .dot-b {
            background: #34d399;
        }

        .dot-c {
            background: #fb923c;
        }

        /* ── Action buttons ── */
        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 14px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: var(--radius);
            font-size: .875rem;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid transparent;
            transition: background .15s, transform .1s, box-shadow .15s;
            user-select: none;
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-primary {
            background: var(--accent);
            color: var(--accent-fg);
            box-shadow: var(--shadow-sm);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            box-shadow: var(--shadow-md);
        }

        .btn-outline {
            background: var(--surface);
            color: var(--text-primary);
            border-color: var(--border);
        }

        .btn-outline:hover {
            background: var(--bg);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-muted);
        }

        .btn-ghost:hover {
            background: var(--bg);
            color: var(--text-primary);
        }

        .btn-sm {
            padding: 5px 11px;
            font-size: .8125rem;
        }

        /* ── Stats bar ── */
        .stats-bar {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .stat {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .stat-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent);
        }

        .stat-label {
            font-size: .75rem;
            color: var(--text-muted);
        }

        /* ── Table ── */
        .table-wrapper {
            overflow-x: auto;
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: .8125rem;
        }

        thead tr {
            background: #f3f4f6;
        }

        th {
            padding: 10px 14px;
            text-align: left;
            font-size: .75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        tbody tr {
            border-bottom: 1px solid #f3f4f6;
            transition: background .12s;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody tr:hover {
            background: #f9fafb;
        }

        td {
            padding: 9px 14px;
            color: var(--text-primary);
            vertical-align: middle;
        }

        td.mono {
            font-family: 'Courier New', monospace;
            font-size: .775rem;
        }

        .model-pill {
            display: inline-block;
            background: #ede9fe;
            color: #5b21b6;
            border-radius: 4px;
            padding: 2px 7px;
            font-size: .75rem;
            font-weight: 500;
            font-family: 'Courier New', monospace;
        }

        .row-num {
            color: var(--text-muted);
            font-size: .7rem;
            font-weight: 600;
            min-width: 28px;
            text-align: center;
        }

        /* ── Empty / Placeholder state ── */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 48px 24px;
            color: var(--text-muted);
            text-align: center;
        }

        .empty-state .emo {
            font-size: 2.5rem;
        }

        .empty-state p {
            font-size: .875rem;
        }

        .empty-state small {
            font-size: .75rem;
        }

        /* ── Toast ── */
        #toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--text-primary);
            color: #fff;
            padding: 10px 18px;
            border-radius: var(--radius);
            font-size: .8125rem;
            font-weight: 500;
            box-shadow: var(--shadow-md);
            opacity: 0;
            transform: translateY(8px);
            transition: opacity .2s, transform .2s;
            pointer-events: none;
            z-index: 999;
        }

        #toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* ── Separator ── */
        .sep {
            height: 1px;
            background: var(--border);
            margin: 4px 0 16px;
        }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 9999px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #9ca3af;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Header -->
        <div class="page-header">
            <h1>
                <span class="icon">📋</span>
                Model Expander
            </h1>
            <p>엑셀 데이터를 붙여넣으면 <strong>PROD_MODEL_CD</strong>의 쉼표(,) 구분 모델을 개별 행으로 자동 분리합니다.</p>
        </div>

        <!-- Input card -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">📥 데이터 입력</span>
            </div>

            <textarea id="pasteArea" class="paste-area"
                placeholder="엑셀에서 CONTENTS_ID, ITEM_ID, PROD_MODEL_CD 열을 선택 후 Ctrl+C → 여기에 Ctrl+V 하세요&#10;&#10;(탭으로 구분된 텍스트 형식으로 붙여넣기됩니다)"
                spellcheck="false"></textarea>

            <div class="col-hint">
                <span class="col-chip"><span class="dot dot-a"></span> A열: CONTENTS_ID</span>
                <span class="col-chip"><span class="dot dot-b"></span> B열: ITEM_ID</span>
                <span class="col-chip"><span class="dot dot-c"></span> C열: PROD_MODEL_CD (쉼표 구분)</span>
            </div>

            <div class="actions">
                <button class="btn btn-primary" id="btnConvert">
                    ⚡ 변환하기
                </button>
                <button class="btn btn-outline" id="btnCopy">
                    📋 결과 복사
                </button>
                <button class="btn btn-ghost btn-sm" id="btnClear">
                    🗑 초기화
                </button>
            </div>
        </div>

        <!-- Result card -->
        <div class="card" id="resultCard" style="display:none;">
            <div class="card-header">
                <span class="card-title">
                    📊 변환 결과
                    <span class="badge success" id="rowCountBadge">0행</span>
                </span>
                <div style="display:flex;gap:8px;">
                    <button class="btn btn-outline btn-sm" id="btnExportTsv">⬇ TSV 복사</button>
                </div>
            </div>

            <div class="stats-bar" id="statsBar"></div>
            <div class="sep"></div>

            <div class="table-wrapper">
                <table id="resultTable">
                    <thead>
                        <tr>
                            <th style="width:36px;">#</th>
                            <th>CONTENTS_ID</th>
                            <th>ITEM_ID</th>
                            <th>PROD_MODEL_CD</th>
                        </tr>
                    </thead>
                    <tbody id="resultBody"></tbody>
                </table>
            </div>
        </div>

        <!-- Empty placeholder (shown before first conversion) -->
        <div class="card" id="emptyCard">
            <div class="empty-state">
                <span class="emo">📂</span>
                <p>아직 변환된 데이터가 없습니다.</p>
                <small>위 입력창에 엑셀 데이터를 붙여넣고 <strong>변환하기</strong>를 클릭하세요.</small>
            </div>
        </div>

    </div>

    <!-- Toast -->
    <div id="toast"></div>

    <script>
        // ── DOM refs ──────────────────────────────────────────────
        const pasteArea = document.getElementById('pasteArea');
        const btnConvert = document.getElementById('btnConvert');
        const btnCopy = document.getElementById('btnCopy');
        const btnClear = document.getElementById('btnClear');
        const btnExportTsv = document.getElementById('btnExportTsv');
        const resultCard = document.getElementById('resultCard');
        const emptyCard = document.getElementById('emptyCard');
        const resultBody = document.getElementById('resultBody');
        const rowCountBadge = document.getElementById('rowCountBadge');
        const statsBar = document.getElementById('statsBar');
        const toastEl = document.getElementById('toast');

        let expandedRows = []; // [{contentsId, itemId, model}]

        // ── Toast helper ──────────────────────────────────────────
        function showToast(msg, duration = 2200) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            setTimeout(() => toastEl.classList.remove('show'), duration);
        }

        // ── Parse & expand ────────────────────────────────────────
        function parseAndExpand(raw) {
            const lines = raw.trim().split(/\r?\n/);
            const result = [];

            for (const line of lines) {
                if (!line.trim()) continue;

                // 탭으로 컬럼 분리 (엑셀 복붙 기본 구분자)
                const cols = line.split('\t');
                if (cols.length < 3) continue;

                const contentsId = cols[0].trim();
                const itemId = cols[1].trim();
                // cols[2] 이후를 모두 합침: 모델명 안에 탭이 섞이는 경우 방지
                const modelRaw = cols.slice(2).join('').trim();

                // 헤더 행 스킵 (CONTENTS_ID 등)
                if (/contents[-_]?id/i.test(contentsId)) continue;

                // ※ 모델 구분자는 ','(쉼표)만 사용
                //   모델명 안의 '.'은 지역코드 구분자(예: 43LM5600ENA.AKRQ)이므로 절대 split하지 않음
                const models = modelRaw.split(',').map(m => m.trim()).filter(Boolean);

                // 모델이 하나도 없으면 원본 유지
                if (models.length === 0) {
                    result.push({ contentsId, itemId, model: '' });
                    continue;
                }

                for (const model of models) {
                    result.push({ contentsId, itemId, model });
                }
            }

            return result;
        }

        // ── Render table ──────────────────────────────────────────
        function renderTable(rows) {
            resultBody.innerHTML = '';

            if (rows.length === 0) {
                resultBody.innerHTML = `
        <tr>
          <td colspan="4" style="text-align:center;padding:32px;color:var(--text-muted);">
            유효한 데이터가 없습니다. 입력을 확인해 주세요.
          </td>
        </tr>`;
                return;
            }

            const fragment = document.createDocumentFragment();
            rows.forEach((row, i) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
        <td class="row-num">${i + 1}</td>
        <td class="mono">${escHtml(row.contentsId)}</td>
        <td class="mono">${escHtml(row.itemId)}</td>
        <td><span class="model-pill">${escHtml(row.model)}</span></td>
      `;
                fragment.appendChild(tr);
            });
            resultBody.appendChild(fragment);
        }

        // ── Stats bar ─────────────────────────────────────────────
        function renderStats(rows) {
            const totalRows = rows.length;
            const uniqueContents = new Set(rows.map(r => r.contentsId)).size;
            const uniqueModels = new Set(rows.map(r => r.model)).size;

            statsBar.innerHTML = `
      <div class="stat"><span class="stat-value">${totalRows}</span><span class="stat-label">총 행(분리 후)</span></div>
      <div class="stat"><span class="stat-value">${uniqueContents}</span><span class="stat-label">고유 CONTENTS_ID</span></div>
      <div class="stat"><span class="stat-value">${uniqueModels}</span><span class="stat-label">고유 모델 수</span></div>
    `;
        }

        // ── Convert ───────────────────────────────────────────────
        function doConvert() {
            const raw = pasteArea.value;
            if (!raw.trim()) {
                showToast('⚠️ 붙여넣기 데이터가 없습니다.');
                pasteArea.focus();
                return;
            }

            expandedRows = parseAndExpand(raw);

            renderStats(expandedRows);
            renderTable(expandedRows);
            rowCountBadge.textContent = `${expandedRows.length}행`;

            emptyCard.style.display = 'none';
            resultCard.style.display = 'block';
            resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' });

            showToast(`✅ ${expandedRows.length}행으로 변환 완료!`);
        }

        // ── Copy result as TSV ────────────────────────────────────
        function copyAsTsv() {
            if (expandedRows.length === 0) { showToast('⚠️ 변환된 데이터가 없습니다.'); return; }

            const header = 'CONTENTS_ID\tITEM_ID\tPROD_MODEL_CD';
            const body = expandedRows.map(r => `${r.contentsId}\t${r.itemId}\t${r.model}`).join('\n');
            const tsv = `${header}\n${body}`;

            navigator.clipboard.writeText(tsv)
                .then(() => showToast('📋 TSV 데이터가 클립보드에 복사됐습니다. 엑셀에 바로 붙여넣기 가능!'))
                .catch(() => showToast('❌ 복사 실패 – 수동으로 복사해 주세요.'));
        }

        // ── Clear ─────────────────────────────────────────────────
        function doClear() {
            pasteArea.value = '';
            expandedRows = [];
            resultCard.style.display = 'none';
            emptyCard.style.display = 'block';
            pasteArea.focus();
            showToast('🗑 초기화되었습니다.');
        }

        // ── Util ──────────────────────────────────────────────────
        function escHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // ── Events ────────────────────────────────────────────────
        btnConvert.addEventListener('click', doConvert);
        btnCopy.addEventListener('click', copyAsTsv);
        btnExportTsv.addEventListener('click', copyAsTsv);
        btnClear.addEventListener('click', doClear);

        // Ctrl+Enter in textarea → convert
        pasteArea.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') doConvert();
        });

        // Auto-convert on paste (after a tick so value is updated)
        pasteArea.addEventListener('paste', () => {
            setTimeout(doConvert, 50);
        });
    </script>
</body>

</html>
